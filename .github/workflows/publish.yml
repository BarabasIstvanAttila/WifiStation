name: Publish to GCR

on:
  workflow_dispatch:

env:
  ACTIONS_RUNNER_DEBUG: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2    
      
      - name: Build and push the image
        run : |
          docker login --username mert2m --password ${{ secrets.GCR_SECRET }} ghcr.io
          docker build . --tag ghcr.io/barabasistvanattila/esp32-camera-server:0.0.1
          docker push ghcr.io/barabasistvanattila/esp32-camera-server:0.0.1

      - name: Verify Image Push
        run: |
          docker pull ghcr.io/barabasistvanattila/esp32-camera-server:0.0.1
          docker images | grep esp32-camera-server
          docker run --rm ghcr.io/barabasistvanattila/esp32-camera-server:0.0.1 python --version
          docker run --rm -p 8080:8080 ghcr.io/barabasistvanattila/esp32-camera-server:0.0.1 curl -I http://localhost:8080/health || true
        
          